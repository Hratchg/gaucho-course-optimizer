name: Weekly Neon DB Backup

on:
  schedule:
    # Every Sunday at 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch: # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        # Neon runs PostgreSQL 17. Ubuntu 24.04's `postgresql-client` is 16, and
        # pg_dump refuses to dump a server newer than itself, so pull 17 from PGDG.
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - name: Dump Neon database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pg_dump "$DATABASE_URL" > data/gco_dump.sql
          echo "Dump size: $(du -h data/gco_dump.sql | cut -f1)"
          echo "Row check:"
          psql "$DATABASE_URL" -c "SELECT COUNT(*) AS gaucho_score_count FROM gaucho_scores;"

      - name: Upload dump as artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-backup-${{ github.run_id }}
          path: data/gco_dump.sql
          retention-days: 90
